# ============================================================
#   BlossomCore  -  Kits
# ============================================================
# After editing, type:  /blossomcore reload
# If you make a mistake in a kit, the console tells you which kit and what.
#
# HOW TO WRITE AN ITEM
#   - "IRON_SWORD"                              one iron sword
#   - "ARROW 32"                                32 arrows
#   - "DIAMOND_SWORD 1 sharpness:1"             item, amount, then enchant:level
#   - "DIAMOND_BOOTS 1 protection:1 unbreaking:1"
#   An item with its own name (or colour, for leather):
#   - item: "DIAMOND_SWORD 1 sharpness:3"
#     name: "&#F4A9C0Blossom Blade"
#     lore:
#       - "&7Forged under the first tree."
#     color: "#F4A9C0"        (leather armour only)
#     glow: true
#
# EACH KIT
#   name                how it looks
#   icon                the item shown in /kits
#   category            which tab it is on (see "categories" below)
#   description         lines shown in the menu
#   cooldown            30m, 12h, 3d, 7d ...  or  once  (one time only)
#   required-rank       free rank needed (from ranks.yml). Leave out = everyone.
#   permission          permission needed. Leave out = no permission. VIP kits use this.
#   max-claims          most times a player can EVER claim it. Leave out = no limit.
#   give-on-first-join  true = handed to brand new players automatically
#   reset-on-death      false = this kit does NOT reset when you die (see death-reset in config.yml)
#
# THE LIMITS IN config.yml ALWAYS WIN
#   Banned items are left out, enchantments above the limit are lowered,
#   and golden apples above the limit are removed. Armour is put on
#   automatically if that slot is empty, and a shield goes in the off hand.

