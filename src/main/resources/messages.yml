  - "&#F4A9C0&l✿ Blossom SMP"
  - " &f/blossom &8- &7the main menu"
  - " &f/ranks &8- &7free ranks and your progress"
  - " &f/rankup &8- &7rank up when you are ready"
  - " &f/kits &8- &7all kits"
