# ============================================================
#   BlossomCore  -  Kits
# ============================================================
# After editing, type:  /blossomcore reload
# If you make a mistake in a kit, the console tells you which kit and what.
#
# One rank = one complete kit: gear, tools, food and potions together. No blocks.
#   Free kits:  Starter -> Seedling -> Sprout -> Gardener -> Bloom -> Blossom -> Sakura -> Eternal
#   VIP kits:   VIP -> VIP+ -> Elite -> Blossom Legend   (each has a sword with abilities)
#   Owner kit:  only for blossomcore.owner
#
# HOW TO WRITE AN ITEM
#   - "IRON_SWORD"                              one iron sword
#   - "ARROW 32"                                32 arrows
#   - "DIAMOND_SWORD 1 sharpness:1"             item, amount, then enchant:level
#   - "SPLASH_POTION 2 potion:strong_healing"   potions: potion:<type>
#        types: swiftness, strong_swiftness, strength, strong_strength, healing, strong_healing,
#               fire_resistance, long_fire_resistance, regeneration, turtle_master ...
#   An item with its own name, lore, trim or colour:
#   - item: "DIAMOND_CHESTPLATE 1 protection:2"
#     name: "&#F4A9C0Blossom Guard"
#     lore:
#       - "&7Forged under the first tree."
#     trim: "amethyst flow"     (armour: trim material, then pattern)
#                                materials: amethyst copper diamond emerald gold iron lapis
#                                           netherite quartz redstone resin
#                                patterns:  bolt coast dune eye flow host raiser rib sentry shaper
#                                           silence snout spire tide vex ward wayfinder wild
#     color: "#F4A9C0"          (leather armour only)
#     glow: true
#   An ability sword from weapons.yml:
#   - weapon: eternal_bloom
#
# EACH KIT
#   name                how it looks
#   icon                the item shown in /kits
#   category            which tab it is on (see "categories" below)
#   description         lines shown in the menu
#   cooldown            30m, 12h, 3d, 7d ...  or  once  (one time only)
#   required-rank       free rank needed (from ranks.yml). Leave out = everyone.
#   permission          permission needed. Leave out = no permission. VIP kits use this.
#   max-claims          most times a player can EVER claim it. Leave out = no limit.
#   give-on-first-join  true = handed to brand new players automatically
#   reset-on-death      false = this kit does NOT reset when you die (see death-reset in config.yml)
#   ignore-limits       true = the limits in config.yml don't apply (only the Owner kit uses this)
#
# THE LIMITS IN config.yml ALWAYS WIN (unless ignore-limits: true)
#   Banned items (maces, crystals...) are left out, enchantments above the limit are lowered,
#   and golden apples above the limit are removed. Armour is put on automatically if that
#   slot is empty, and a shield goes in the off hand.

