name: BlossomBiomes
version: 1.2.0
main: com.blossomsmp.biomes.BlossomBiomes
api-version: '1.21'
author: BlossomSMP
description: The Blossom SMP custom biomes, with discovery rewards, biome materials, a trader and biome bosses.
# Must start before the worlds load, so bukkit.yml can use it as the world's biome provider.
load: STARTUP

commands:
  biome:
    description: Shows which biome you are in
  biomes:
    description: The Blossom biomes menu, bosses and the Blossom Trader (staff can click to teleport)
    usage: /biomes [biome]
  blossombiomes:
    description: Staff commands for BlossomBiomes
    aliases: [bbiomes]
    usage: /blossombiomes <where|sanctuary|shrines|boss|give|resetdiscover|reload>
    permission: blossombiomes.admin

permissions:
  blossombiomes.teleport:
    description: Click a biome in /biomes (or /biomes <biome>) to teleport to the nearest one
    default: op
  blossombiomes.admin:
    description: Use /blossombiomes, and break a shrine chest by sneaking (removes it)
    default: op
