# ============================================================
#   BlossomCore  -  Ability weapons
# ============================================================
# Swords with abilities that kits can hand out. Put one in a kit with:
#     - weapon: eternal_bloom
# After editing, type:  /blossomcore reload
# Give one to test:     /blossomcore weapon give <player> <weapon>
#
# EACH WEAPON
#   item        material, then enchant:level (same as kits.yml)
#   name, lore  how it looks. The ability lines are added to the lore by themselves.
#   color       colour of the ability lines
#   particle    a simple particle: CHERRY_LEAVES, END_ROD, FLAME, SOUL_FIRE_FLAME,
#               SNOWFLAKE, HAPPY_VILLAGER, ENCHANT, HEART, TOTEM_OF_UNDYING ...
#   glow        enchantment shine (true/false)
#
#   right-click / shift-right-click / left-click   (leave one out = no ability there)
#     type      one of the types below
#     name      what it's called
#     cooldown  seconds
#     + the settings of that type
#
# ABILITY TYPES                       SETTINGS (damage is in half hearts: 4 = 2 hearts)
#   dash       dash forward            damage, power
#   leap       jump up and slam down   damage, radius, up, forward
#   burst      blast enemies around    damage, radius, knockback
#   heal       heal yourself           hearts, regen-seconds, regen-level, absorption-hearts
#   bolt       beam at the first enemy damage, range, fire-seconds
#   pull       pull an enemy to you    range, power, damage
#   lightning  lightning where you look damage, radius, range
#   guard      Resistance + gold hearts seconds, resistance-level, absorption-hearts
#   Any type can also have:  effect: slowness   effect-seconds: 3   effect-level: 1
#   (the effect goes on every enemy it hits: slowness, wither, poison, weakness, levitation...)
#
# PASSIVE (always on while it's in your hand)
#   name
#   lifesteal            % of the damage you deal that heals you
#   on-hit-effect        an effect your hits can give (wither, poison, slowness...)
#   on-hit-chance        % chance (100 = every hit)
#   on-hit-seconds, on-hit-level
#   on-hit-fire-seconds  set enemies on fire
#   holding-effect       an effect you have while holding it (speed, haste...)
#   holding-level
#   no-fall-damage       true = no fall damage while holding it

