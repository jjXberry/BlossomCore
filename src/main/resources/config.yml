      name: "&#E27D9C&lSanctuary Knight"
      weight: 3
      health: 120
      damage: 16
      speed: 0.3
      armor: 14
      knockback-resistance: 0.6
      main-hand: "NETHERITE_SWORD 1 sharpness:5 fire_aspect:2"
      helmet: "NETHERITE_HELMET 1 protection:4"
      chestplate: "NETHERITE_CHESTPLATE 1 protection:4"
    - entity: SKELETON
      name: "&#F4A9C0&lPetal Archer"
      weight: 3
      health: 80
      speed: 0.3
      armor: 10
      main-hand: "BOW 1 power:5 punch:2 flame:1"
      helmet: "DIAMOND_HELMET 1 protection:4"
      chestplate: "DIAMOND_CHESTPLATE 1 protection:3"
    - entity: ZOMBIE
      name: "&#9AA8FF&lBlossom Revenant"
      weight: 2
      health: 100
      damage: 14
      speed: 0.32
      armor: 12
      knockback-resistance: 0.4
      main-hand: "NETHERITE_AXE 1 sharpness:4"
      helmet: "NETHERITE_HELMET 1 protection:3"
      leggings: "NETHERITE_LEGGINGS 1 protection:3"
    - entity: VINDICATOR
      name: "&#FFD98A&lAncient Warden"
      weight: 1
      health: 160
      damage: 20
      speed: 0.33
      armor: 16
      knockback-resistance: 0.8
      main-hand: "NETHERITE_AXE 1 sharpness:5"

# ------------------------------------------------------------
# What a shrine chest holds (filled once, when the guardians are beaten)
# ------------------------------------------------------------
