      model: blossom:eternal_petal
      lore: ["&#FFD98AMythic", "&7A petal from the first tree.", "&7It never wilts."]
      glow: true
  # Extra random picks (higher weight = more common)
  rolls: 5
  random:
    - item: "NETHERITE_SWORD 1 sharpness:5 unbreaking:3 mending:1 fire_aspect:2 looting:3 sweeping_edge:3"
      name: "&#FFD98A&lEternal Blossom Blade"
      model: blossom:eternal_blossom_blade
      lore: ["&#FFD98AMythic", "&7Forged where the first blossom fell."]
      weight: 2
    - item: "NETHERITE_SWORD 1 sharpness:5 unbreaking:3 mending:1 knockback:2"
      name: "&#F4A9C0&lSakura Katana"
      model: blossom:sakura_katana
      lore: ["&#E27D9CLegendary"]
      weight: 3
    - item: "BOW 1 power:5 punch:2 flame:1 infinity:1 unbreaking:3"
      name: "&#F4A9C0&lPetal Bow"
      model: blossom:petal_bow
      lore: ["&#E27D9CLegendary"]
      weight: 4
    - item: "NETHERITE_PICKAXE 1 efficiency:5 fortune:3 unbreaking:3 mending:1"
      name: "&#3FBF62&lEmerald Blossom Pickaxe"
      model: blossom:emerald_blossom_pickaxe
      lore: ["&#E27D9CLegendary"]
      weight: 4
    - item: "SHIELD 1 unbreaking:3 mending:1"
      name: "&#9AA8FF&lGuardian's Shield"
      lore: ["&#B48CFFEpic"]
      weight: 4
    - item: "NETHERITE_HELMET 1 protection:4 unbreaking:3 mending:1"
      name: "&#F4A9C0Sanctuary Crown"
      model: blossom:sanctuary_crown
      lore: ["&#B48CFFEpic"]
      weight: 3
    - item: "NETHERITE_CHESTPLATE 1 protection:4 unbreaking:3 mending:1"
      name: "&#F4A9C0Sanctuary Guard"
      model: blossom:sanctuary_guard
      lore: ["&#B48CFFEpic"]
      weight: 3
    - item: "NETHERITE_LEGGINGS 1 protection:4 unbreaking:3 mending:1"
      name: "&#F4A9C0Sanctuary Greaves"
      model: blossom:sanctuary_greaves
      lore: ["&#B48CFFEpic"]
      weight: 3
    - item: "NETHERITE_BOOTS 1 protection:4 feather_falling:4 unbreaking:3 mending:1"
      name: "&#F4A9C0Sanctuary Treads"
      model: blossom:sanctuary_treads
      lore: ["&#B48CFFEpic"]
      weight: 3
    - item: "AMETHYST_SHARD 1"
      name: "&#9AA8FF&lMoonlight Crystal"
      model: blossom:moonlight_crystal
      lore: ["&#E27D9CLegendary", "&7Still cold from the night sky."]
      glow: true
      weight: 4
    - {item: "ELYTRA 1", weight: 2}
    - {item: "TOTEM_OF_UNDYING 1", weight: 4}
    - {item: "ENCHANTED_GOLDEN_APPLE 2", weight: 3}
    - {item: "NETHERITE_INGOT 2", weight: 5}
    - {item: "NETHERITE_UPGRADE_SMITHING_TEMPLATE 2", weight: 5}
    - {item: "DIAMOND_BLOCK 4", weight: 6}
    - {item: "TRIDENT 1 loyalty:3 impaling:5 unbreaking:3", weight: 2}
  # Console commands when someone claims a shrine ({player} = their name)
  commands:
    - "petals give {player} 2500"

# The command that gives money ({player}, {amount}). "" = no money.
money-command: "eco give {player} {amount}"

# BlossomQuests: discovering biomes, gathering materials and beating biome bosses count for
# its quests and achievements (needs BlossomQuests 1.1.0 or newer). auto / true / false
quests-hook: auto

# ============================================================
#   DISCOVERY: rewards the first time a player walks into each biome
# ============================================================
discovery:
  enabled: true
  rewards:
    sakura_forest: {money: 1000, petals: 100}
    blossom_meadows: {money: 1000, petals: 100}
    moonlight_garden: {money: 1500, petals: 150}
    emerald_grove: {money: 1000, petals: 100}
    frosted_blossom_valley: {money: 1000, petals: 100}
    ancient_blossom_sanctuary: {money: 5000, petals: 500}
  # Tell the whole server when someone finds the Sanctuary for the first time
  broadcast-sanctuary: true
  # Finding all six
  all-found:
    money: 15000
    petals: 1500
    items: ["DIAMOND 16", "material:ancient_relic 2", "GOLDEN_APPLE 8"]
    # Console commands, e.g. a LuckPerms tag: "lp user {player} permission set blossom.tag.explorer"
    commands: []
    broadcast: true

# ============================================================
#   BIOME MATERIALS: each biome drops its own material
# ============================================================
# blocks: block -> % chance per block broken (#tag = a Minecraft block tag)
# mob-chance: % chance when you kill a monster in that biome
# price: what the Blossom Trader in /biomes pays for one
# Blocks that players placed themselves never drop materials.
materials:
  sakura_petal:
    name: "&#F4A9C0Sakura Petal"
    item: PINK_DYE
    biomes: [sakura_forest]
    blocks: {CHERRY_LEAVES: 5, PINK_PETALS: 10}
    mob-chance: 6
    price: 25
  blossom_nectar:
    name: "&#F7D774Blossom Nectar"
    item: HONEYCOMB
    biomes: [blossom_meadows]
    blocks: {"#small_flowers": 6, BEEHIVE: 40, CHERRY_LEAVES: 3}
    mob-chance: 6
    price: 25
  moonstone:
    name: "&#9AA8FFMoonstone"
    item: PRISMARINE_CRYSTALS
    biomes: [moonlight_garden]
    blocks: {PEARLESCENT_FROGLIGHT: 50, AMETHYST_CLUSTER: 25, LARGE_AMETHYST_BUD: 12, AZALEA_LEAVES: 2, FLOWERING_AZALEA_LEAVES: 4, PALE_OAK_LEAVES: 2}
    mob-chance: 8
    price: 50
  verdant_leaf:
    name: "&#3FBF62Verdant Leaf"
    item: LIME_DYE
    biomes: [emerald_grove]
    blocks: {JUNGLE_LEAVES: 3, EMERALD_ORE: 30, DEEPSLATE_EMERALD_ORE: 30, MOSS_CARPET: 6, VINE: 2}
    mob-chance: 6
    price: 30
  frost_blossom:
    name: "&#BFD9FFFrost Blossom"
    item: LIGHT_BLUE_DYE
    biomes: [frosted_blossom_valley]
    blocks: {CHERRY_LEAVES: 6, ICE: 8, PACKED_ICE: 8, BLUE_ICE: 15}
    mob-chance: 6
    price: 35
  ancient_relic:
    name: "&#FFD98A&lAncient Relic"
    item: GOLD_NUGGET
    biomes: [ancient_blossom_sanctuary]
    blocks: {}
    mob-chance: 12
    # Every shrine guardian drops this many
    guardian-drop: 2
    price: 400

# Boss charms are made at the Blossom Trader from a biome's material.
# Right-click one inside that biome to wake its boss.
charm-cost: 32

# ============================================================
#   BIOME BOSSES: one for each biome (the Sanctuary has its shrine guardians)
# ============================================================
bosses:
  enabled: true
  # Bosses wake up by themselves near players exploring Blossom biomes
  natural-spawn:
    enabled: true
    every-minutes: 30
    chance: 60
    max-awake: 2
    # How far from the player it appears (blocks)
    min-distance: 24
    max-distance: 40
  # A boss with nobody within 64 blocks for this long goes back to sleep (no rewards)
  sleep-after-seconds: 300
  # A boss pulled further than this from where it woke up jumps back
  leash: 40
  # Players this close see the health bar
  bar-range: 60
  # Rewards go to everyone who did at least this % of the damage
  min-damage-share: 10
  # Tell the whole server when a boss wakes up and when it's beaten
  broadcast: true
  types:
    ronin:
      biome: sakura_forest
      name: "&#F4A9C0&l✿ Ronin of Falling Petals"
      entity: ZOMBIE
      glow: light_purple
      bar-color: PINK
      particle: CHERRY_LEAVES
      scale: 1.3
      health: 300
      damage: 9
      armor: 8
      speed: 0.3
      knockback-resistance: 0.6
      gear:
        main-hand: "IRON_SWORD 1"
        helmet: {item: "LEATHER_HELMET 1", color: "#F4A9C0"}
        chestplate: {item: "LEATHER_CHESTPLATE 1", color: "#F4A9C0"}
        leggings: {item: "LEATHER_LEGGINGS 1", color: "#2B2B2B"}
        boots: {item: "LEATHER_BOOTS 1", color: "#2B2B2B"}
      every-seconds: 6
      abilities:
        - {type: dash, name: "Petal Dash", damage: 7}
        - {type: nova, name: "Petal Storm", radius: 6, damage: 5, effect: WITHER, level: 1, seconds: 4, particle: CHERRY_LEAVES}
        - {type: summon, name: "Petal Shades", entity: ZOMBIE, count: 2, minion-name: "&#F4A9C0Petal Shade", health: 30}
      rewards: {money: 3000, petals: 150, xp: 150}
      loot:
        always: ["material:sakura_petal 12"]
        rolls: 2
        random:
          - {item: "DIAMOND 3", weight: 6}
          - {item: "GOLDEN_APPLE 2", weight: 5}
          - {item: "EXPERIENCE_BOTTLE 16", weight: 5}
          - {item: "ENCHANTED_BOOK 1 sharpness:4", weight: 3}
          - item: "DIAMOND_SWORD 1 sharpness:4 unbreaking:3"
            name: "&#F4A9C0Ronin's Blade"
            lore: ["&#B48CFFRare", "&7Still smells of cherry blossom."]
            weight: 2
          - item: "DIAMOND_HELMET 1 protection:3 unbreaking:3"
            name: "&#F4A9C0Ronin's Kabuto"
            lore: ["&#B48CFFRare"]
            weight: 2
    bramblehorn:
      biome: blossom_meadows
      name: "&#8FCB9B&l❀ Bramblehorn"
      entity: RAVAGER
      glow: green
      bar-color: GREEN
      particle: SPORE_BLOSSOM_AIR
      scale: 1.1
      health: 360
      damage: 10
      armor: 10
      speed: 0.3
      knockback-resistance: 1.0
      every-seconds: 7
      abilities:
        - {type: shockwave, name: "Stampede", radius: 6, damage: 7}
        - {type: roots, name: "Bramble Snare", radius: 4, damage: 3, seconds: 3}
        - {type: summon, name: "Angry Swarm", entity: BEE, count: 3, minion-name: "&#F7D774Meadow Bee", health: 12}
      rewards: {money: 3000, petals: 150, xp: 150}
      loot:
        always: ["material:blossom_nectar 12"]
        rolls: 2
        random:
          - {item: "DIAMOND 3", weight: 6}
          - {item: "GOLDEN_APPLE 2", weight: 5}
          - {item: "HONEY_BOTTLE 8", weight: 4}
          - {item: "ENCHANTED_BOOK 1 protection:3", weight: 3}
          - item: "DIAMOND_BOOTS 1 protection:2 feather_falling:4 unbreaking:3"
            name: "&#8FCB9BMeadowstrider Boots"
            lore: ["&#B48CFFRare", "&7Light as a falling petal."]
            weight: 2
          - item: "SADDLE 1"
            weight: 3
    moon_sorceress:
      biome: moonlight_garden
      name: "&#9AA8FF&l☾ Moonlit Sorceress"
      entity: EVOKER
      glow: aqua
      bar-color: BLUE
      particle: END_ROD
      scale: 1.4
      health: 260
      damage: 8
