# ============================================================
#   BlossomBiomes  -  Blossom SMP custom biomes
# ============================================================
# Needs the BlossomBiomes datapack in world/datapacks, and in bukkit.yml:
#   worlds:
#     world:
#       biome-provider: BlossomBiomes
# Colours: &a, &l ...   Hex: &#F4A9C0
#
# !!! The "placement" and "sanctuary" settings shape the WORLD. Set them before the
# !!! world is created and don't change them after, or new land won't line up with old land.
# Everything else (mobs, loot, messages) can be changed any time: /blossombiomes reload

placement:
  # Blossom biomes start this far from 0,0 (blocks). Closer than this: only vanilla.
  start-distance: 5000
  # By this distance they reach full coverage
  full-distance: 10000
  # Share of land that becomes a Blossom biome once past full-distance (0.40 = 40%)
  coverage: 0.40
  # Rough size of one Blossom area, in blocks
  patch-size: 900
  # Rough size of one single biome inside an area (so you see several next to each other)
  region-size: 650
  # How often each biome is picked (Frosted Blossom Valley replaces cold land automatically)
  weights:
    sakura_forest: 30
    blossom_meadows: 30
    emerald_grove: 25
    moonlight_garden: 15
  # These vanilla biomes are never replaced (water, beaches, peaks, caves)
  keep-vanilla: [ocean, deep_ocean, cold_ocean, deep_cold_ocean, frozen_ocean, deep_frozen_ocean,
                 lukewarm_ocean, deep_lukewarm_ocean, warm_ocean, river, frozen_river, beach, snowy_beach,
                 stony_shore, mushroom_fields, lush_caves, dripstone_caves, deep_dark,
                 jagged_peaks, frozen_peaks, stony_peaks]
  # Cold vanilla land becomes Frosted Blossom Valley
  cold-biomes: [snowy_plains, ice_spikes, snowy_taiga, snowy_slopes, grove]

# The super rare Ancient Blossom Sanctuary.
# The world is cut into squares of cell-size blocks; each square has a "chance" to hold one
# round sanctuary of "radius" blocks. With these numbers a 100,000 world border holds about
# 40-60 of them, and the closest is usually 11,000-15,000 blocks from spawn.
sanctuary:
  min-distance: 10000
  cell-size: 8000
  chance: 0.30
  radius: 160

# Big text when a player walks into a Blossom biome
enter-titles: true
names:
  sakura_forest: "&#F4A9C0✿ Sakura Forest"
  blossom_meadows: "&#8FCB9B❀ Blossom Meadows"
  moonlight_garden: "&#9AA8FF☾ Moonlight Garden"
  emerald_grove: "&#3FBF62❦ Emerald Grove"
  frosted_blossom_valley: "&#BFD9FF❄ Frosted Blossom Valley"
  ancient_blossom_sanctuary: "&#FFD98A&l✦ Ancient Blossom Sanctuary ✦"
subtitles:
  sakura_forest: "&7Petals drift on the wind"
  blossom_meadows: "&7Rolling hills of flowers"
  moonlight_garden: "&7It glows when the sun goes down"
  emerald_grove: "&7Giant trees and hidden emeralds"
  frosted_blossom_valley: "&7Blossoms under the snow"
  ancient_blossom_sanctuary: "&cAncient guardians watch this place"

# Custom item and menu textures from the Blossom resource pack.
#   auto  = on when server.properties has a resource-pack link (recommended)
#   true / false = force on or off
custom-icons: auto

# How far /biomes looks for the nearest biome before giving up (blocks)
teleport-search-radius: 30000

# What /biomes says about each biome
biome-info:
  sakura_forest:
    - "&7Thick cherry blossom forest."
    - "&7Giant sakura trees, torii gates"
    - "&7and stone lanterns."
    - "&8Found 5,000+ blocks from spawn"
  blossom_meadows:
    - "&7Rolling hills of flowers,"
    - "&7lone cherry trees and beehives."
    - "&8Found 5,000+ blocks from spawn"
  moonlight_garden:
    - "&7A garden that glows at night:"
    - "&7crystal spires, moonstones,"
    - "&7fireflies and glowing moss."
    - "&8Found 5,000+ blocks from spawn"
  emerald_grove:
    - "&7Giant jungle trees, mossy rocks"
    - "&7and lots of emerald ore."
    - "&8Found 5,000+ blocks from spawn"
  frosted_blossom_valley:
    - "&7Cherry trees in the snow,"
    - "&7frozen lakes and ice spikes."
    - "&8Replaces cold land past 5,000 blocks"
  ancient_blossom_sanctuary:
    - "&#FFD98ASuper rare."
    - "&7Ancient guardians protect a shrine"
    - "&7full of legendary treasure."
    - "&8Only 10,000+ blocks from spawn"

# Builds that generate in the biomes: chance per chunk (0 to 1). Only affects NEW land.
decorations:
  enabled: true
  sakura_forest:
    giant-sakura: 0.22
    torii-gate: 0.04
    stone-lantern: 0.12
    fallen-log: 0.12
  blossom_meadows:
    boulder: 0.10
    stone-lantern: 0.06
    beehive-post: 0.07
    giant-sakura: 0.03
  moonlight_garden:
    crystal-spire: 0.18
    moonstones: 0.25
    glow-moss: 0.5
    soul-lantern: 0.08
  emerald_grove:
    boulder: 0.25
    fallen-log: 0.25
    glow-moss: 0.15
  frosted_blossom_valley:
    giant-sakura: 0.14
    ice-spike: 0.15
    stone-lantern: 0.06
  ancient_blossom_sanctuary:
    broken-pillar: 0.45
    torchflowers: 0.35
    soul-lantern: 0.15

# The command that gives Petals ({player}, {amount}). "" = no Petals.
petals-command: "petals give {player} {amount}"

# ------------------------------------------------------------
# Every monster that spawns naturally in the Sanctuary becomes an elite
# ------------------------------------------------------------
elites:
  enabled: true
  name: "&#E27D9CAncient {mob}"
  health-multiplier: 2.5
  damage-multiplier: 1.6
  speed-multiplier: 1.15
  armor: 6
  bonus-xp: 20
  petals: 15
  # chance is in % per kill. Items are written like in BlossomCore's kits.yml.
  drops:
    - {item: "EMERALD 2", chance: 25}
    - {item: "DIAMOND 1", chance: 10}
    - {item: "GOLDEN_APPLE 1", chance: 5}
    - {item: "NETHERITE_SCRAP 1", chance: 2}

# ------------------------------------------------------------
# Shrine guardians: they appear when someone first opens a shrine chest.
# The chest stays shut until every guardian is dead.
# ------------------------------------------------------------
guardians:
  count: 5
  bonus-xp: 60
  petals: 150
  drops:
    - {item: "DIAMOND 2", chance: 50}
    - {item: "NETHERITE_SCRAP 1", chance: 15}
    - {item: "ENCHANTED_GOLDEN_APPLE 1", chance: 3}
